    <!-- Light by default; apply a saved dark choice before first paint, so it never flashes white -->
    <script>
      (function () {
        var dark = false;
        try { dark = localStorage.getItem('theme') === 'dark'; } catch (e) {}
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        // 'only light': phone browsers that force dark mode (samsung internet, chrome's auto-dark)
        // would otherwise repaint the light theme black
        root.style.colorScheme = dark ? 'dark' : 'only light';
        if (dark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111112');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
        }
      })();
    </script>
